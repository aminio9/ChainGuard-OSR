[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chainguard-osr"
version = "0.1.0"
description = "ChainGuard-OSR: Federated Open-Set Recognition and Conformal Defense for Blockchain Network Traffic"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mohammad Hassan Amini", email = "aminimohammadhasan7@gmail.com" },
]
license = { text = "MIT" }
keywords = [
    "federated-learning",
    "open-set-recognition",
    "conformal-prediction",
    "blockchain-security",
    "information-bottleneck",
    "primal-dual-consensus",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "flwr>=1.8.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "rich>=13.7.0",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
