experiment:
  name: "federated_osr_canonical"
  seed: 42
  device: "auto" # "cuda", "cpu", or "auto"
  output_dir: "results/runs"
  checkpoint_dir: "checkpoints"
  save_checkpoints: true
  save_frequency: 10

data:
  dataset_name: "b_nat"
  data_dir: "data/raw"
  in_features: 31
  num_classes_total: 5
  known_classes: [0, 1, 2, 3]          # Normal, BP, DoS, MitM
  unknown_classes: [4]                 # FoT (Zero-day unknown attack)
  test_split_ratio: 0.2
  cal_split_ratio: 0.1                 # Calibration set for Conformal Prediction

federated:
  num_clients: 10
  client_fraction: 1.0                 # Full or partial client participation
  num_rounds: 30                       # Communication rounds
  local_epochs: 2                      # E = 2 local epochs per round (Section 5.3)
  batch_size: 64                       # B_s = 64 mini-batch size (Section 5.3)
  num_blocks: 1                        # B = 1 full covariance (or B = 2 for lightweight edge mode)
  block_dim: 64                        # d_b = 64 (or 32 for Block-2)
  tikhonov_eps: 0.0001                 # Tikhonov stabilizer epsilon_v = 1e-4
  shrinkage_method: "oas"              # Server-Side OAS Shrinkage (Chen et al. 2010)
  partition:
    strategy: "iid"                    # "iid" or "dirichlet"
    beta_dirichlet: 0.5                # Non-IID Dirichlet parameter

model:
  architecture: "vib_network"
  in_features: 31
  latent_dim: 64                       # d_z = 64 bottleneck dimension
  hidden_dim: [256, 128]               # High-capacity MLP backbone: 256 -> 128
  dropout: 0.1
  use_batchnorm: true
  use_layernorm: false
  activation: "relu"
  stochastic_encoder: true

optimization:
  optimizer: "adam"                    # Adam with Cosine Annealing (Section 5.3)
  learning_rate: 0.001                 # eta_0 = 10^-3 (Section 5.3)
  eta_min: 0.000001                    # eta_min = 10^-6 (Section 5.3)
  weight_decay: 0.0001
  clip_grad_norm: 1.0                  # Gradient clipping at 1.0 (Section 5.3)

loss:
  tau_bla: 1.0                         # Balanced logit-adjusted margin (Section 4.2.1, L_BLA)
  laplace_eps: 0.1                     # Laplace smoothing for local priors (Section 4.2.1)
  lambda_vib: 0.01                     # VIB KL penalty weight (Section 4.2.2)
  beta_cb: 0.999                       # Deprecated fallback
  focal_gamma: 2.0                     # Deprecated fallback
  lambda_anchor: 0.0                   # Anchor loss removed in favor of L_BLA

osr:
  method: "block_mahalanobis_conformal"
  metric_type: "mahalanobis"            # OAS Mahalanobis (Theorem 1: Law of Total Variance)
  conformal_alpha: 0.05                # 95% guaranteed coverage bound (alpha = 0.05)
  num_blocks: 1                        # Primary: Full Covariance (B=1, d_b=64)
  block_dim: 64
  normalize_features: false            # Preserve full 64-D anisotropic covariance structure
  shrinkage_method: "oas"
  use_multi_prototype: true            # Macro-Prototype Profiling (AEGIS-Net / MPHIL)
  num_prototypes_normal: 4             # M_0 = 4 macro-prototypes for multi-modal normal traffic
  num_prototypes_attack: 1             # M_c = 1 prototype for known attack categories
